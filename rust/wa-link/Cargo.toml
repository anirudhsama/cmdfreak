[package]
name = "wa-link"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
whatsapp-rust = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
qrcode = { version = "0.14", default-features = false }
anyhow = "1"
