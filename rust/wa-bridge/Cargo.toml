[package]
name = "wa-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "wa_bridge"

[dependencies]
uniffi = { workspace = true, features = ["tokio"] }
thiserror = "2"
whatsapp-rust = { workspace = true }
whatsapp-rust-ureq-http-client = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f9811768bdc61340222268bce279c39e962a9638" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
log = { version = "0.4", features = ["std"] }
# Routes any `tracing` events in the graph into the `log` facade (no subscriber is installed),
# so one logger forwards both to Swift.
tracing = { version = "0.1", default-features = false, features = ["std", "log"] }
ogg = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
bytes = "1"

[dev-dependencies]
flate2 = "1"
